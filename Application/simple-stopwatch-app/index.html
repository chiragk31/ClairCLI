<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Stopwatch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stopwatch-container">
        <h1>Stopwatch</h1>
        <div id="display" class="display">00:00:00.000</div>
        <div class="controls">
            <button id="startButton" class="button start">Start</button>
            <button id="stopButton" class="button stop" disabled>Stop</button>
            <button id="resetButton" class="button reset" disabled>Reset</button>
            <button id="lapButton" class="button lap" disabled>Lap</button>
        </div>
        <div class="laps-container">
            <h2>Laps</h2>
            <ul id="lapsList" class="laps-list">
                <!-- Lap times will be inserted here -->
            </ul>
        </div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
